<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lesson — Zuzu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0C0C;--s1:#141414;--s2:#1A1A1A;--s3:#222;--s4:#2A2A2A;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.11);--border3:rgba(255,255,255,.17);
  --accent:#5E6AD2;--accent-h:#6B77E8;--accent-dim:rgba(94,106,210,.13);
  --green:#22C55E;--green-dim:rgba(34,197,94,.1);--green-b:rgba(34,197,94,.28);
  --red:#EF4444;--red-dim:rgba(239,68,68,.1);--red-b:rgba(239,68,68,.28);
  --amber:#F59E0B;--amber-dim:rgba(245,158,11,.1);
  --t1:#EBEBEB;--t2:rgba(235,235,235,.6);--t3:rgba(235,235,235,.32);--t4:rgba(235,235,235,.14);
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --r:10px;--r-lg:14px;--r-xl:18px;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t1);display:flex;flex-direction:column}

/* ── PROGRESS LINE ── */
.progress-line{height:2px;background:var(--border);position:relative;flex-shrink:0}
.progress-line-fill{position:absolute;left:0;top:0;height:100%;background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;padding:14px 20px 12px;gap:16px;flex-shrink:0}
.close-link{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--t3);font-size:.82em;font-weight:500;transition:color .12s;white-space:nowrap}
.close-link:hover{color:var(--t1)}
.close-link svg{opacity:.6}
.lesson-title-bar{flex:1;text-align:center}
.lesson-title-text{font-size:.82em;font-weight:600;color:var(--t2)}
.lesson-meta{font-family:var(--mono);font-size:.7em;color:var(--t3);margin-top:2px}
.top-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.hearts-display{display:flex;gap:3px}
.heart-dot{width:8px;height:8px;border-radius:50%;background:var(--red);transition:all .3s}
.heart-dot.lost{background:var(--border2);transform:scale(.75)}
.xp-display{font-family:var(--mono);font-size:.78em;font-weight:600;color:var(--amber);background:var(--amber-dim);border:1px solid rgba(245,158,11,.2);border-radius:6px;padding:3px 8px}

/* ── EXERCISE AREA ── */
.ex-outer{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.ex-card{width:100%;max-width:560px;display:flex;flex-direction:column;gap:0}

.ex-type-label{font-family:var(--mono);font-size:.7em;font-weight:600;color:var(--t4);letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px}
.ex-prompt{font-size:1.2em;font-weight:600;letter-spacing:-.2px;line-height:1.5;color:var(--t1);margin-bottom:22px}

/* Audio button */
.audio-btn{display:inline-flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 16px;font-family:var(--font);font-size:.9em;font-weight:500;color:var(--t2);cursor:pointer;margin-bottom:20px;transition:background .12s,border-color .12s,color .12s}
.audio-btn:hover{background:var(--s3);border-color:var(--border3);color:var(--t1)}
.audio-btn svg{opacity:.6;flex-shrink:0}

/* Multiple choice */
.mc-opts{display:flex;flex-direction:column;gap:8px}
.mc-opt{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--border2);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--font);font-size:.93em;font-weight:500;color:var(--t1);transition:background .1s,border-color .1s,transform .1s;width:100%;min-height:52px}
.mc-opt:hover:not(:disabled){background:var(--s2);border-color:var(--border3)}
.mc-opt:active:not(:disabled){transform:scale(.99)}
.mc-opt.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--t1)}
.mc-opt.correct{border-color:var(--green-b);background:var(--green-dim);color:var(--green)}
.mc-opt.wrong{border-color:var(--red-b);background:var(--red-dim);color:var(--red);animation:subtleShake .35s ease}
@keyframes subtleShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.mc-key{width:24px;height:24px;border-radius:6px;background:var(--s3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:700;font-family:var(--mono);color:var(--t3);flex-shrink:0;transition:all .1s}
.mc-opt.selected .mc-key{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.mc-opt.correct .mc-key{background:var(--green-dim);border-color:var(--green-b);color:var(--green)}
.mc-opt.wrong .mc-key{background:var(--red-dim);border-color:var(--red-b);color:var(--red)}

/* Tap word */
.answer-zone{min-height:52px;border-bottom:1.5px solid var(--border3);margin-bottom:20px;padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;transition:border-color .2s}
.answer-zone.has-content{border-color:var(--accent)}
.word-bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-start}
.w-tile{background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);padding:8px 13px;font-family:var(--font);font-size:.88em;font-weight:500;color:var(--t1);cursor:pointer;user-select:none;transition:background .1s,border-color .1s,transform .1s;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.w-tile:hover:not([disabled]){background:var(--s3);border-color:var(--border3);transform:translateY(-1px)}
.w-tile:active:not([disabled]){transform:translateY(0);box-shadow:none}
.w-tile.in-ans{background:var(--accent-dim);border-color:var(--accent)}
.w-tile.c-tile{border-color:var(--green-b);background:var(--green-dim);color:var(--green)}
.w-tile.w-tile-wrong{border-color:var(--red-b);background:var(--red-dim);color:var(--red);animation:subtleShake .35s ease}

/* Translation */
.trans-input{width:100%;background:var(--s1);border:1px solid var(--border2);border-radius:var(--r-lg);padding:14px 16px;font-family:var(--font);font-size:.95em;font-weight:500;color:var(--t1);outline:none;resize:none;min-height:72px;transition:border-color .15s}
.trans-input:focus{border-color:var(--accent)}
.trans-input.correct{border-color:var(--green-b);background:var(--green-dim)}
.trans-input.wrong{border-color:var(--red-b);background:var(--red-dim);animation:subtleShake .35s ease}
.ans-hint{font-size:.8em;color:var(--green);margin-top:8px;font-weight:500;display:none}
.ans-hint.show{display:block}

/* Matching */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match-btn{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r-lg);padding:12px;text-align:center;font-family:var(--font);font-size:.88em;font-weight:500;color:var(--t2);cursor:pointer;transition:all .12s;min-height:48px;display:flex;align-items:center;justify-content:center;border:none}
.match-btn{border:1px solid var(--border2)}
.match-btn:hover:not(:disabled){background:var(--s2);border-color:var(--border3);color:var(--t1)}
.match-btn.m-sel{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.match-btn.m-done{border-color:var(--green-b);background:var(--green-dim);color:var(--green);pointer-events:none}
.match-btn.m-wrong{border-color:var(--red-b);background:var(--red-dim);animation:subtleShake .35s ease}

/* ── COMBO ── */
.combo-pill{position:fixed;top:70px;right:20px;z-index:50;background:var(--s2);border:1px solid var(--amber-dim);border-radius:20px;padding:5px 12px;font-family:var(--mono);font-size:.75em;font-weight:600;color:var(--amber);display:none;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

/* ── FEEDBACK BAR ── */
.feedback-bar{flex-shrink:0;padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);transition:background .2s,border-color .2s}
.feedback-bar.fb-correct{background:var(--green-dim);border-color:var(--green-b)}
.feedback-bar.fb-wrong{background:var(--red-dim);border-color:var(--red-b)}
.feedback-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.feedback-msg{font-size:.88em;font-weight:600;display:none}
.feedback-msg.show{display:block}
.feedback-msg.fb-correct{color:var(--green)}
.feedback-msg.fb-wrong{color:var(--red)}
.feedback-note{font-size:.78em;color:var(--t2);display:none;line-height:1.5}
.feedback-note.show{display:block}
.check-btn{width:100%;background:var(--s2);color:var(--t3);border:1px solid var(--border2);border-radius:var(--r-lg);padding:13px;font-family:var(--font);font-size:.9em;font-weight:600;cursor:not-allowed;transition:all .15s}
.check-btn.ready{background:var(--accent);color:white;border-color:transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(94,106,210,.4) inset}
.check-btn.ready:hover{background:var(--accent-h)}
.check-btn.ready:active{transform:scale(.99)}
.check-btn.fb-correct{background:var(--green);color:white;border-color:transparent;cursor:pointer}
.check-btn.fb-correct:hover{opacity:.9}
.check-btn.fb-wrong{background:var(--red);color:white;border-color:transparent;cursor:pointer}
.kbhint{text-align:center;font-family:var(--mono);font-size:.65em;color:var(--t4);margin-top:5px}

/* ── COMPLETE ── */
.complete-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:20px;text-align:center}
.complete-overlay.show{display:flex;animation:scaleUp .3s cubic-bezier(.17,.67,.3,1.2)}
@keyframes scaleUp{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.co-icon{font-size:52px;margin-bottom:4px}
.co-title{font-size:1.7em;font-weight:700;letter-spacing:-.4px}
.co-sub{font-size:.9em;color:var(--t2);max-width:300px}
.co-stats{display:flex;gap:10px;width:100%;max-width:360px}
.co-stat{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;text-align:center}
.co-val{font-family:var(--mono);font-size:1.4em;font-weight:600;display:block;margin-bottom:3px}
.co-lbl{font-size:.7em;color:var(--t3);font-weight:500}
.co-xp{font-family:var(--mono);font-size:1.3em;font-weight:700;color:var(--amber);animation:xpScale .4s cubic-bezier(.17,.67,.3,1.5) .3s both}
@keyframes xpScale{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.co-btn{background:var(--accent);color:white;border:none;border-radius:var(--r-lg);padding:14px 32px;font-family:var(--font);font-size:.95em;font-weight:600;cursor:pointer;transition:background .12s,transform .1s;box-shadow:0 0 0 1px rgba(94,106,210,.4) inset;max-width:360px;width:100%}
.co-btn:hover{background:var(--accent-h);transform:translateY(-1px)}

/* ── NO HEARTS ── */
.noheart-sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:998;display:none;align-items:flex-end;justify-content:center}
.noheart-sheet.show{display:flex}
.nhs-inner{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:28px 24px 32px;width:100%;max-width:520px;text-align:center;border-bottom:none}
.nhs-icon{font-size:40px;margin-bottom:12px}
.nhs-title{font-size:1.2em;font-weight:700;margin-bottom:6px}
.nhs-sub{font-size:.85em;color:var(--t2);line-height:1.6;margin-bottom:20px}
.nhs-btn{width:100%;border-radius:var(--r-lg);padding:13px;font-family:var(--font);font-size:.9em;font-weight:600;border:none;cursor:pointer;margin-bottom:8px;transition:opacity .12s}
.nhs-btn.primary{background:var(--accent);color:white}
.nhs-btn.secondary{background:var(--s3);color:var(--t2)}
.nhs-btn:hover{opacity:.9}

/* confetti */
@keyframes cfall{0%{opacity:1;transform:translateY(0) rotate(0) scaleX(1)}100%{opacity:0;transform:translateY(100vh) rotate(540deg) scaleX(-1)}}

/* responsive */
@media(max-width:600px){
  .top-bar{padding:10px 14px 8px;gap:10px}
  .ex-outer{padding:14px 12px}
  .feedback-bar{padding:12px 14px}
}
</style>
</head>
<body>

<!-- PROGRESS LINE -->
<div class="progress-line"><div class="progress-line-fill" id="prog-line" style="width:0%"></div></div>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="/" class="close-link">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13 1L1 13M1 1l12 12"/></svg>
    Exit
  </a>
  <div class="lesson-title-bar">
    <div class="lesson-title-text" id="lesson-title-text">Loading…</div>
    <div class="lesson-meta" id="lesson-meta"></div>
  </div>
  <div class="top-right">
    <div class="hearts-display" id="hearts-display"></div>
    <div class="xp-display" id="xp-display">+0 XP</div>
  </div>
</div>

<!-- COMBO PILL -->
<div class="combo-pill" id="combo-pill">🔥 ×<span id="combo-num">2</span></div>

<!-- EXERCISE -->
<div class="ex-outer">
  <div class="ex-card" id="ex-card"></div>
</div>

<!-- FEEDBACK BAR -->
<div class="feedback-bar" id="fb-bar">
  <div class="feedback-inner">
    <div class="feedback-msg" id="fb-msg"></div>
    <div class="feedback-note" id="fb-note"></div>
    <button class="check-btn" id="check-btn" onclick="handleCheck()">Check</button>
    <div class="kbhint">Press <kbd>Space</kbd> to continue</div>
  </div>
</div>

<!-- COMPLETE -->
<div class="complete-overlay" id="complete-overlay">
  <div class="co-icon" id="co-icon">🏅</div>
  <div class="co-title">Lesson complete</div>
  <div class="co-sub" id="co-sub"></div>
  <div class="co-stats" id="co-stats"></div>
  <div class="co-xp" id="co-xp"></div>
  <button class="co-btn" onclick="window.location.href='/'">Back to dashboard →</button>
</div>

<!-- NO HEARTS -->
<div class="noheart-sheet" id="noheart-sheet">
  <div class="nhs-inner">
    <div class="nhs-icon">💔</div>
    <div class="nhs-title">No hearts remaining</div>
    <div class="nhs-sub">You've used all your hearts for this session. Practice mode lets you keep going without penalty.</div>
    <button class="nhs-btn primary" onclick="enterPractice()">Continue in practice mode</button>
    <a href="/"><button class="nhs-btn secondary">Return to dashboard</button></a>
  </div>
</div>

<script>
const LESSON = JSON.parse({{ lesson_json | tojson }});
const EX = LESSON.exercises;

const S = {
  idx:0, hearts:{{ hearts }}, xp:0,
  combo:0, correct:0, mistakes:0,
  phase:'answering', selected:null,
  tapAns:[], matchState:{sel:null,matched:[]},
  practice:false
};

const CORRECT_MSGS = ['Correct','Well done','Exactly right','Perfetto','Esatto'];
const WRONG_MSGS = ['Not quite','Keep going','Try again','Close — review the hint'];

// Audio
let _ctx;
function ac() { if(!_ctx) _ctx=new(window.AudioContext||window.webkitAudioContext)(); return _ctx; }
function tone(f,t='sine',d=0.12,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.2,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.01);}catch(e){}}
function playOk(){tone(523,'sine',.08);tone(659,'sine',.08,.09);tone(784,'sine',.14,.18)}
function playErr(){tone(220,'sawtooth',.12);tone(160,'sawtooth',.15,.12)}
function playTick(){tone(880,'sine',.04)}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.82;const v=speechSynthesis.getVoices().find(x=>x.lang?.startsWith('it'));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

// Boot
function boot(){
  document.getElementById('lesson-title-text').textContent = LESSON.title;
  document.getElementById('lesson-meta').textContent = `Unit ${LESSON.unit} · ${LESSON.subtitle}`;
  renderHearts(); load();
}

function renderHearts(){
  const d=document.getElementById('hearts-display'); d.innerHTML='';
  for(let i=0;i<5;i++){const el=document.createElement('div');el.className='heart-dot'+(i>=S.hearts?' lost':'');d.appendChild(el);}
}

function updateProg(){
  document.getElementById('prog-line').style.width=(S.idx/EX.length*100)+'%';
  document.getElementById('xp-display').textContent='+'+S.xp+' XP';
}

function load(){
  S.phase='answering'; S.selected=null; S.tapAns=[]; S.matchState={sel:null,matched:[]};
  const ex=EX[S.idx], card=document.getElementById('ex-card');
  card.innerHTML='';
  ({multiple_choice:mc,tap_word:tapWord,translation:trans,fill_blank:fill,matching:match,listening:listen})[ex.type]?.(ex,card);
  resetFeedback(); updateProg();
  if(ex.type==='listening'&&ex.audio) setTimeout(()=>speak(ex.audio),400);
}

// Renderers
function mc(ex,card){
  card.innerHTML=`<div class="ex-type-label">Select the correct answer</div>${ex.audio?`<button class="audio-btn" onclick="speak('${esc(ex.audio)}')">${speakerSVG()} ${ex.audio}</button>`:''}<div class="ex-prompt">${ex.prompt}</div><div class="mc-opts" id="opts"></div>`;
  const keys=['A','B','C','D'], opts=document.getElementById('opts');
  ex.options.forEach((o,i)=>{const b=document.createElement('button');b.className='mc-opt';b.innerHTML=`<span class="mc-key">${keys[i]}</span>${o}`;b.onclick=()=>{if(S.phase!=='answering')return;opts.querySelectorAll('.mc-opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');S.selected=i;playTick();readyCheck();};opts.appendChild(b);});
}

function listen(ex,card){
  card.innerHTML=`<div class="ex-type-label">What did you hear?</div><button class="audio-btn" onclick="speak('${esc(ex.audio||'')}')" style="font-size:1.1em;font-weight:600">${speakerSVG()} ${ex.audio}</button><div class="ex-prompt">${ex.prompt}</div><div class="mc-opts" id="opts"></div>`;
  const keys=['A','B','C','D'], opts=document.getElementById('opts');
  ex.options.forEach((o,i)=>{const b=document.createElement('button');b.className='mc-opt';b.innerHTML=`<span class="mc-key">${keys[i]}</span>${o}`;b.onclick=()=>{if(S.phase!=='answering')return;opts.querySelectorAll('.mc-opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');S.selected=i;playTick();readyCheck();};opts.appendChild(b);});
}

function tapWord(ex,card){
  const all=[...ex.tokens,...(ex.distractors||[])].sort(()=>Math.random()-.5);
  card.innerHTML=`<div class="ex-type-label">Arrange the words</div><div class="ex-prompt">${ex.prompt}</div><div class="answer-zone" id="az"></div><div class="word-bank" id="wb"></div>`;
  const wb=document.getElementById('wb');
  all.forEach(w=>{const t=document.createElement('button');t.className='w-tile';t.textContent=w;t.dataset.w=w;t.onclick=()=>tapToggle(t,w);wb.appendChild(t);});
}

function tapToggle(tile,word){
  if(S.phase!=='answering')return;
  if(tile.classList.contains('in-ans')){tile.classList.remove('in-ans');const i=S.tapAns.indexOf(word);if(i>-1)S.tapAns.splice(i,1);}
  else{tile.classList.add('in-ans');S.tapAns.push(word);playTick();}
  const az=document.getElementById('az');
  az.textContent=S.tapAns.join(' ');
  az.classList.toggle('has-content',S.tapAns.length>0);
  S.tapAns.length>0?readyCheck():document.getElementById('check-btn').className='check-btn';
}

function trans(ex,card){
  card.innerHTML=`<div class="ex-type-label">Type in Italian</div><div class="ex-prompt">${ex.prompt}</div><textarea class="trans-input" id="ti" placeholder="Type your answer…"></textarea><div class="ans-hint" id="ah"></div>`;
  const ti=document.getElementById('ti');
  ti.addEventListener('input',()=>ti.value.trim()?readyCheck():document.getElementById('check-btn').className='check-btn');
  setTimeout(()=>ti.focus(),100);
}

function fill(ex,card){
  const sent=ex.sentence.replace('___','<span id="blank" style="color:var(--accent);border-bottom:1.5px solid var(--accent);padding:0 4px">___</span>');
  card.innerHTML=`<div class="ex-type-label">Fill in the blank</div><div class="ex-prompt">${ex.prompt}</div><div style="font-size:1.1em;font-weight:600;margin-bottom:20px;line-height:1.6">${sent}</div><div class="mc-opts" id="opts"></div>`;
  const keys=['A','B','C','D'], opts=document.getElementById('opts');
  ex.options.forEach((o,i)=>{const b=document.createElement('button');b.className='mc-opt';b.innerHTML=`<span class="mc-key">${keys[i]}</span>${o}`;b.onclick=()=>{if(S.phase!=='answering')return;opts.querySelectorAll('.mc-opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');S.selected=i;const bl=document.getElementById('blank');if(bl)bl.textContent=o;playTick();readyCheck();};opts.appendChild(b);});
}

function match(ex,card){
  const pairs=[...ex.pairs].sort(()=>Math.random()-.5);
  const rights=pairs.map(p=>p[1]).sort(()=>Math.random()-.5);
  card.innerHTML=`<div class="ex-type-label">Match the pairs</div><div class="ex-prompt">${ex.prompt}</div><div class="match-grid" id="mg"></div>`;
  const mg=document.getElementById('mg'); S.mpairs=pairs; S.mleft=[]; S.mright=[];
  pairs.forEach((p,i)=>{
    const lb=document.createElement('button');lb.className='match-btn';lb.textContent=p[0];lb.onclick=()=>matchSel(lb,'L',i,p[0]);S.mleft.push(lb);mg.appendChild(lb);
    const rb=document.createElement('button');rb.className='match-btn';rb.textContent=rights[i];rb.onclick=()=>matchSel(rb,'R',i,rights[i]);S.mright.push(rb);mg.appendChild(rb);
  });
}

function matchSel(btn,side,idx,val){
  if(S.phase!=='answering')return;
  const ms=S.matchState;
  if(side==='L'){S.mleft.forEach(b=>{if(!b.classList.contains('m-done'))b.classList.remove('m-sel')});btn.classList.add('m-sel');ms.sel={btn,val};}
  else{
    if(!ms.sel)return;
    const cp=S.mpairs.find(p=>p[0]===ms.sel.val);
    if(cp&&cp[1]===val){ms.sel.btn.classList.remove('m-sel');ms.sel.btn.classList.add('m-done');btn.classList.add('m-done');ms.matched.push(ms.sel.val);ms.sel=null;playTick();if(ms.matched.length===S.mpairs.length){S.selected='done';readyCheck();}}
    else{ms.sel.btn.classList.add('m-wrong');btn.classList.add('m-wrong');playErr();setTimeout(()=>{ms.sel?.btn.classList.remove('m-sel','m-wrong');btn.classList.remove('m-wrong');ms.sel=null;},450);}
  }
}

// Evaluate
function evaluate(ex){
  switch(ex.type){
    case 'multiple_choice': case 'listening': return S.selected===ex.correct;
    case 'fill_blank': return S.selected===ex.correct;
    case 'tap_word': return S.tapAns.join(' ').toLowerCase()===ex.tokens.join(' ').toLowerCase();
    case 'translation': {const v=document.getElementById('ti')?.value.toLowerCase().trim()||'';return [ex.answer,...(ex.accept_also||[])].some(a=>lev(v,a.toLowerCase())<=2);}
    case 'matching': return S.selected==='done';
  }
}

function lev(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i||j));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}

// Check
function handleCheck(){
  if(S.phase==='feedback'){next();return;}
  if(S.phase!=='answering')return;
  const ex=EX[S.idx], ok=evaluate(ex);
  S.phase='feedback';
  if(ok){S.correct++;S.combo++;S.xp+=10+Math.min((S.combo-1)*3,15);playOk();showFB(true,ex);}
  else{S.mistakes++;S.combo=0;if(!S.practice){S.hearts=Math.max(0,S.hearts-1);renderHearts();}playErr();showFB(false,ex);}
  highlightAns(ex,ok); updateProg(); showCombo();
  if(!S.practice&&S.hearts===0) setTimeout(()=>document.getElementById('noheart-sheet').classList.add('show'),700);
}

function showFB(ok,ex){
  const bar=document.getElementById('fb-bar'), msg=document.getElementById('fb-msg'), note=document.getElementById('fb-note'), btn=document.getElementById('check-btn');
  bar.className='feedback-bar '+(ok?'fb-correct':'fb-wrong');
  msg.className='feedback-msg show '+(ok?'fb-correct':'fb-wrong');
  msg.textContent=ok?CORRECT_MSGS[Math.floor(Math.random()*CORRECT_MSGS.length)]:WRONG_MSGS[Math.floor(Math.random()*WRONG_MSGS.length)];
  if(ex.feedback){note.className='feedback-note show';note.textContent=ex.feedback;}
  btn.className='check-btn '+(ok?'fb-correct':'fb-wrong'); btn.textContent='Continue →';
}

function highlightAns(ex,ok){
  if(ex.type==='multiple_choice'||ex.type==='listening'){const btns=document.querySelectorAll('.mc-opt');btns.forEach((b,i)=>{b.disabled=true;if(i===ex.correct)b.classList.add('correct');});if(!ok&&S.selected!=null)btns[S.selected]?.classList.add('wrong');}
  else if(ex.type==='fill_blank'){const btns=document.querySelectorAll('#opts .mc-opt');btns.forEach((b,i)=>{b.disabled=true;if(i===ex.correct)b.classList.add('correct');});if(!ok&&S.selected!=null)btns[S.selected]?.classList.add('wrong');}
  else if(ex.type==='translation'){const ti=document.getElementById('ti');if(ti){ti.disabled=true;ti.className='trans-input '+(ok?'correct':'wrong');}if(!ok){const ah=document.getElementById('ah');if(ah){ah.className='ans-hint show';ah.textContent='Correct: '+ex.answer;}}}
  else if(ex.type==='tap_word'){document.querySelectorAll('.w-tile').forEach(t=>t.disabled=true);const az=document.getElementById('az');if(az)az.style.borderColor=ok?'var(--green)':'var(--red)';}
}

function showCombo(){
  if(S.combo<2)return;
  const el=document.getElementById('combo-pill');
  document.getElementById('combo-num').textContent=S.combo;
  el.style.display='block'; clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.display='none',2000);
}

function next(){
  S.idx++;
  S.idx>=EX.length?complete():load();
}

function complete(){
  const ov=document.getElementById('complete-overlay');
  ov.classList.add('show');
  const pct=S.correct>0?Math.round(S.correct/(S.correct+S.mistakes)*100):0;
  const perfect=S.mistakes===0;
  document.getElementById('co-icon').textContent=perfect?'⭐':pct>=80?'✅':'📝';
  document.getElementById('co-sub').textContent=perfect?'Perfect score — no mistakes!':pct>=80?'Great work, keep it up.':'Review the tricky questions and try again.';
  document.getElementById('co-stats').innerHTML=`<div class="co-stat"><span class="co-val" style="color:var(--green)">${S.correct}</span><span class="co-lbl">Correct</span></div><div class="co-stat"><span class="co-val" style="color:${S.mistakes?'var(--red)':'var(--green)'}">${S.mistakes}</span><span class="co-lbl">Mistakes</span></div><div class="co-stat"><span class="co-val" style="color:var(--accent)">${pct}%</span><span class="co-lbl">Accuracy</span></div>`;
  const fin=S.xp+(perfect?5:0);
  document.getElementById('co-xp').textContent='+'+fin+' XP earned';
  confetti();
  fetch('/api/complete-lesson',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson_id:LESSON.id,xp:fin,mistakes:S.mistakes,correct:S.correct})}).catch(()=>{});
}

function enterPractice(){S.practice=true;S.hearts=5;renderHearts();document.getElementById('noheart-sheet').classList.remove('show');}

function resetFeedback(){
  const bar=document.getElementById('fb-bar'),msg=document.getElementById('fb-msg'),note=document.getElementById('fb-note'),btn=document.getElementById('check-btn');
  bar.className='feedback-bar'; msg.className='feedback-msg'; note.className='feedback-note';
  btn.className='check-btn'; btn.textContent='Check'; btn.onclick=handleCheck;
}

function readyCheck(){document.getElementById('check-btn').className='check-btn ready';}

// Confetti (refined, smaller)
function confetti(){
  const c=['#5E6AD2','#22C55E','#F59E0B','#EF4444','#A78BFA','#64748B'];
  for(let i=0;i<60;i++) setTimeout(()=>{
    const el=document.createElement('div');const s=4+Math.random()*7;
    el.style.cssText=`position:fixed;width:${s}px;height:${s}px;background:${c[Math.floor(Math.random()*c.length)]};left:${Math.random()*100}vw;top:-6px;border-radius:${Math.random()>.6?'50%':'1px'};z-index:9999;pointer-events:none;opacity:.9;animation:cfall ${1.2+Math.random()*1.8}s ease-in forwards`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),3200);
  },Math.random()*600);
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(S.phase==='answering'){
    const opts=document.querySelectorAll('.mc-opt');
    if(e.key>='1'&&e.key<='4'&&opts.length){const i=parseInt(e.key)-1;opts[i]?.click();}
    if(e.key===' '&&S.selected!=null){e.preventDefault();handleCheck();}
  } else if(S.phase==='feedback'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();handleCheck();}
  }
});

function esc(s){return s.replace(/'/g,"\\'")}
function speakerSVG(){return `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 5h4l4-4v14l-4-4H1V5z"/><path d="M12 4a4 4 0 010 8"/></svg>`}

boot();
</script>
