<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Glow -->
  <circle cx="60" cy="62" r="38" fill="rgba(94,106,210,0.12)"/>

  <!-- Body -->
  <ellipse cx="60" cy="68" rx="22" ry="26" fill="#1C1C2E"/>
  <ellipse cx="60" cy="68" rx="22" ry="26" fill="url(#bodyGrad)"/>

  <!-- Wings -->
  <path d="M38 72 C28 58 26 44 34 40 C40 38 46 46 46 56" fill="#2A2A4E" stroke="#5E6AD2" stroke-width="0.8"/>
  <path d="M82 72 C92 58 94 44 86 40 C80 38 74 46 74 56" fill="#2A2A4E" stroke="#5E6AD2" stroke-width="0.8"/>

  <!-- Chest accent -->
  <ellipse cx="60" cy="74" rx="12" ry="16" fill="rgba(94,106,210,0.2)"/>
  <ellipse cx="60" cy="74" rx="8" ry="11" fill="rgba(94,106,210,0.15)"/>

  <!-- Head -->
  <circle cx="60" cy="44" r="20" fill="#1C1C2E"/>
  <circle cx="60" cy="44" r="20" fill="url(#headGrad)"/>

  <!-- Ear tufts (owl ears) -->
  <path d="M48 26 L44 18 L52 24 Z" fill="#5E6AD2"/>
  <path d="M72 26 L76 18 L68 24 Z" fill="#5E6AD2"/>

  <!-- Eyes (AI glowing) -->
  <circle cx="52" cy="44" r="7" fill="#0C0C1A"/>
  <circle cx="68" cy="44" r="7" fill="#0C0C1A"/>
  <circle cx="52" cy="44" r="7" stroke="#5E6AD2" stroke-width="1.2"/>
  <circle cx="68" cy="44" r="7" stroke="#5E6AD2" stroke-width="1.2"/>
  <!-- Iris glow -->
  <circle cx="52" cy="44" r="4" fill="#5E6AD2" opacity="0.9"/>
  <circle cx="68" cy="44" r="4" fill="#5E6AD2" opacity="0.9"/>
  <!-- Pupil -->
  <circle cx="52" cy="44" r="2" fill="#EBEBEB"/>
  <circle cx="68" cy="44" r="2" fill="#EBEBEB"/>
  <!-- Eye shine -->
  <circle cx="54" cy="42" r="1" fill="white" opacity="0.8"/>
  <circle cx="70" cy="42" r="1" fill="white" opacity="0.8"/>

  <!-- AI circuit marks on forehead -->
  <line x1="56" y1="32" x2="64" y2="32" stroke="#5E6AD2" stroke-width="0.8" opacity="0.6"/>
  <circle cx="56" cy="32" r="1" fill="#5E6AD2" opacity="0.7"/>
  <circle cx="64" cy="32" r="1" fill="#5E6AD2" opacity="0.7"/>
  <line x1="60" y1="32" x2="60" y2="28" stroke="#5E6AD2" stroke-width="0.8" opacity="0.4"/>

  <!-- Beak -->
  <path d="M56 50 L60 56 L64 50 Z" fill="#F59E0B"/>

  <!-- Feet -->
  <path d="M52 92 L48 100 M52 92 L52 100 M52 92 L56 100" stroke="#5E6AD2" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M68 92 L64 100 M68 92 L68 100 M68 92 L72 100" stroke="#5E6AD2" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Italian flag ribbon -->
  <rect x="44" y="86" width="6" height="8" rx="1" fill="#009246"/>
  <rect x="50" y="86" width="6" height="8" rx="1" fill="#ffffff"/>
  <rect x="56" y="86" width="6" height="8" rx="1" fill="#CE2B37"/>

  <!-- Floating sparkles -->
  <circle cx="24" cy="38" r="2" fill="#5E6AD2" opacity="0.5"/>
  <circle cx="96" cy="42" r="1.5" fill="#F59E0B" opacity="0.6"/>
  <circle cx="20" cy="60" r="1" fill="#5E6AD2" opacity="0.4"/>
  <circle cx="100" cy="64" r="1.5" fill="#5E6AD2" opacity="0.4"/>
  <circle cx="30" cy="80" r="1" fill="#22C55E" opacity="0.5"/>
  <circle cx="90" cy="28" r="2" fill="#CE82FF" opacity="0.4"/>

  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2E2E50"/>
      <stop offset="100%" stop-color="#141420"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2E2E50"/>
      <stop offset="100%" stop-color="#141420"/>
    </radialGradient>
  </defs>
</svg>
