name: Deploy Website & Notify Users

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: 'Custom notification message'
        required: false
        default: 'Zuzu website has been updated!'

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/srv-d7v1gb8sfn5c738ojbog/deploys \
            -d '{}'
          echo "Render deploy triggered"

      - name: Wait for deploy (2 min)
        run: sleep 120

      - name: Notify App Users
        run: |
          MSG="${{ github.event.inputs.message || 'Zuzu has new content! Check out the latest stories and lessons.' }}"
          curl -s -X POST https://zuzu-italian-bot.onrender.com/api/notify \
            -H "Content-Type: application/json" \
            -H "X-Admin-Key: ${{ secrets.NOTIFY_ADMIN_KEY }}" \
            -d "{\"title\":\"📚 Zuzu Updated!\",\"body\":\"$MSG\"}" \
            || echo "Notification sent (or no users yet)"

      - name: Submit Sitemap to Google
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://zuzu-italian-bot.onrender.com/static/sitemap.xml"
          curl -s "https://www.bing.com/ping?sitemap=https://zuzu-italian-bot.onrender.com/static/sitemap.xml"
          echo "Sitemaps pinged to Google and Bing"
